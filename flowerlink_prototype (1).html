<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flower Link — Mobile App Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,560;9..144,650;9..144,720&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#FFC42B; --gold-deep:#E39A00; --navy:#12224A; --navy2:#1B2E5E; --cream:#FFF8EA;
  --white:#FFFFFF; --ink:#241E16; --ink-soft:#8B8072; --rose:#EF5B72;
  --sage:#7C9473; --choc:#8B5E34; --line:#F0E6D2; --danger:#D64545; --ok:#5C9464;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background: radial-gradient(circle at 30% 10%, #2a2f45 0%, #15161f 55%, #0c0d13 100%);
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:48px 16px; font-family:'Manrope',sans-serif;
}
.rig{display:flex;flex-direction:column;align-items:center;gap:14px;}
.rig-label{color:#6b7290;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;}
.phone{width:390px;height:844px;background:#111;border-radius:52px;padding:14px;box-shadow:0 40px 90px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.04);position:relative;}
.screen{width:100%;height:100%;background:var(--white);border-radius:38px;overflow:hidden;position:relative;}
.notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:28px;background:#111;border-radius:20px;z-index:80;}
.status{display:flex;justify-content:space-between;align-items:center;padding:16px 26px 4px;font-size:14px;font-weight:700;color:var(--ink);flex:0 0 auto;}
.status .icons{display:flex;gap:5px;align-items:center;}
.appwrap{height:100%;display:flex;flex-direction:column;}
.content{flex:1;overflow-y:auto;-ms-overflow-style:none;scrollbar-width:none;}
.content::-webkit-scrollbar{display:none;}
h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:600;color:var(--ink);}
button{font-family:'Manrope',sans-serif;cursor:pointer;border:none;background:none;}
button:active,.prod-card:active,.cat-card:active,.catgrid-card:active,.chip:active{transform:scale(.97);}
svg{display:block;}
.appwrap,.splash,.ob{animation:screenIn .32s ease;}
@keyframes screenIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ---- topbar (secondary screens) ---- */
.topbar{display:flex;align-items:center;gap:12px;padding:8px 18px 14px;flex:0 0 auto;}
.topbar .backbtn{width:38px;height:38px;border-radius:13px;background:var(--white);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(36,30,22,.06);flex:0 0 auto;}
.topbar .backbtn svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2.4;}
.topbar h2{font-size:19px;flex:1;}
.topbar .tbadge{width:38px;height:38px;border-radius:13px;background:var(--white);display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 4px 14px rgba(36,30,22,.06);}
.topbar .tbadge svg{width:17px;height:17px;stroke:var(--ink);}

/* ---- app header (home) ---- */
.app-header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 8px;flex:0 0 auto;}
.brandmark{display:flex;align-items:center;min-width:0;}
.brandmark .full-logo{display:block;width:164px;height:auto;max-height:48px;object-fit:contain;object-position:left center;}
.header-icons{display:flex;gap:10px;}
.icon-btn{width:42px;height:42px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;position:relative;border:1px solid #F1E6D5;box-shadow:0 7px 18px rgba(18,34,74,.11);}
.icon-btn svg{width:20px;height:20px;stroke:var(--navy);stroke-width:2.2;}
.icon-btn.on svg{stroke:var(--rose);fill:var(--rose);}
.badge{position:absolute;top:-4px;right:-4px;background:var(--rose);color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid var(--cream);}

/* ---- search ---- */
.search-wrap{padding:6px 20px 6px;}
.search-bar{display:flex;align-items:center;gap:10px;background:var(--white);border-radius:18px;padding:14px 16px;box-shadow:0 6px 18px rgba(36,30,22,.05);border:1px solid var(--line);}
.search-bar input{border:none;outline:none;background:transparent;flex:1;font-family:'Manrope';font-size:13.5px;color:var(--ink);font-weight:500;}
.search-bar input::placeholder{color:var(--ink-soft);font-weight:500;}
.search-bar svg{width:17px;height:17px;stroke:var(--gold-deep);stroke-width:2.4;flex:0 0 auto;}
.search-bar.rev{flex-direction:row;}

/* ---- hero ---- */
.hero-wrap{padding:18px 20px 4px;}
.hero{position:relative;border-radius:26px;overflow:hidden;background:linear-gradient(120deg,#1a2242 0%,#24305e 45%,#3a2a12 100%);min-height:190px;display:flex;align-items:center;padding:22px 0 22px 22px;}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 15% 25%,rgba(255,196,43,.35),transparent 55%);}
.hero-copy{position:relative;z-index:2;width:56%;}
.hero-eyebrow{display:inline-block;color:var(--gold);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:7px;}
.hero-copy h2{color:#fff;font-size:22px;line-height:1.12;margin-bottom:6px;}
.hero-copy .price-line{color:var(--gold);font-family:'Fraunces';font-size:15px;font-weight:650;margin-bottom:3px;}
.hero-copy .sub{color:rgba(255,255,255,.65);font-size:11px;margin-bottom:14px;font-weight:500;}
.hero-cta{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:var(--navy);font-weight:800;font-size:12px;padding:9px 16px;border-radius:30px;box-shadow:0 8px 20px rgba(255,196,43,.35);}
.hero-cta svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.8;flex:0 0 14px;}
.hero-imgs{position:absolute;right:-10px;top:0;bottom:0;width:48%;-webkit-mask-image:radial-gradient(ellipse 100% 100% at 70% 50%,#000 60%,transparent 100%);mask-image:radial-gradient(ellipse 100% 100% at 70% 50%,#000 60%,transparent 100%);}
.hero-imgs img{width:100%;height:100%;object-fit:cover;object-position:center;}
.hero-dots{display:flex;justify-content:center;gap:6px;padding:12px 0 4px;}
.hero-dots .d{width:6px;height:6px;border-radius:50%;background:var(--line);}
.hero-dots .d.active{width:18px;border-radius:4px;background:var(--gold-deep);}

/* ---- section header ---- */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;padding:20px 20px 12px;}
.sec-head h3{font-size:18px;}
.sec-head .eyebrow{display:block;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--sage);font-weight:700;margin-bottom:2px;}
.view-all{font-size:11px;font-weight:700;color:var(--gold-deep);white-space:nowrap;display:flex;align-items:center;gap:2px;}
.view-all svg{width:12px;height:12px;stroke:var(--gold-deep);}

/* ---- horizontal chip scroller (occasions) ---- */
.chip-scroll{display:flex;gap:10px;overflow-x:auto;padding:0 20px 4px;}
.chip-scroll::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;background:var(--white);border:1px solid var(--line);border-radius:30px;padding:9px 15px;font-size:12px;font-weight:700;color:var(--ink);box-shadow:0 4px 12px rgba(36,30,22,.04);}
.chip.active{background:var(--navy);color:var(--gold);border-color:var(--navy);}

/* ---- category cards (home scroller) ---- */
.cat-scroll{display:flex;gap:12px;overflow-x:auto;padding:0 20px 6px;}
.cat-scroll::-webkit-scrollbar{display:none;}
.cat-card{position:relative;flex:0 0 108px;height:126px;border-radius:20px;overflow:hidden;box-shadow:0 8px 18px rgba(36,30,22,.08);}
.cat-card img{width:100%;height:100%;object-fit:cover;}
.cat-card .lbl{position:absolute;left:0;right:0;bottom:0;padding:10px 10px 9px;background:linear-gradient(0deg,rgba(18,34,74,.9),transparent 75%);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:space-between;}
.cat-card .lbl svg{width:12px;height:12px;stroke:var(--gold);}

/* ---- category grid (categories screen) ---- */
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 20px 20px;}
.catgrid-card{position:relative;border-radius:22px;overflow:hidden;height:150px;box-shadow:0 8px 20px rgba(36,30,22,.08);}
.catgrid-card img{width:100%;height:100%;object-fit:cover;}
.catgrid-card .ov{position:absolute;inset:0;background:linear-gradient(0deg,rgba(18,34,74,.88),rgba(18,34,74,.05));display:flex;flex-direction:column;justify-content:flex-end;padding:14px;}
.catgrid-card .ov b{color:#fff;font-family:'Fraunces';font-size:16px;}
.catgrid-card .ov span{color:var(--gold);font-size:10.5px;font-weight:700;margin-top:2px;}

/* ---- product cards (premium redesign) ---- */
.prod-scroll{display:flex;gap:14px;overflow-x:auto;padding:2px 20px 8px;}
.prod-scroll::-webkit-scrollbar{display:none;}
.prodgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:8px 20px 20px;}
.prod-card{flex:0 0 148px;height:198px;background:#E9E2D7;border-radius:20px;overflow:hidden;box-shadow:0 13px 28px -14px rgba(18,34,74,.28);transition:transform .22s ease,box-shadow .22s ease;position:relative;isolation:isolate;}
.prod-card:hover{transform:translateY(-3px);box-shadow:0 20px 40px -14px rgba(18,34,74,.34);}
.prodgrid .prod-card{flex:none;width:100%;}
.prod-media{position:absolute;inset:0;overflow:hidden;background:var(--line);}
.prod-media::after{content:'';position:absolute;inset:28% 0 0;background:linear-gradient(to top,rgba(8,15,32,.95) 0%,rgba(8,15,32,.72) 32%,rgba(8,15,32,.24) 68%,transparent 100%);z-index:1;}
.prod-media img{width:100%;height:100%;object-fit:cover;transition:transform .45s ease;}
.prod-card:hover .prod-media img{transform:scale(1.035);}
.rating-chip{position:absolute;top:9px;left:9px;background:rgba(255,255,255,.94);border-radius:10px;padding:4px 8px;display:flex;align-items:center;gap:3px;font-size:10px;font-weight:800;color:var(--ink);}
.rating-chip svg{width:10px;height:10px;fill:var(--gold-deep);stroke:var(--gold-deep);}
.heart-btn{position:absolute;top:9px;right:9px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;transition:transform .18s;z-index:3;}
.heart-btn svg{width:14px;height:14px;stroke:var(--ink);fill:none;stroke-width:2;}
.heart-btn.on{transform:scale(1.08);}
.heart-btn.on svg{fill:var(--rose);stroke:var(--rose);}
.disc-badge{position:absolute;bottom:9px;left:9px;background:var(--rose);color:#fff;font-size:9px;font-weight:800;padding:3px 8px;border-radius:8px;}
.prod-info{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:28px 12px 12px;color:#fff;}
.pcat{font-size:9px;font-weight:800;color:var(--gold-deep);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;}
.pname{font-family:'Fraunces',serif;font-size:15px;font-weight:600;color:#fff;margin-bottom:8px;line-height:1.2;min-height:0;text-shadow:0 1px 12px rgba(0,0,0,.35);}
.prod-row{display:flex;align-items:center;justify-content:space-between;}
.prod-row>svg{width:16px;height:16px;color:var(--gold);stroke-width:2.5;}
.prod-price .now{font-family:'Manrope';font-weight:800;font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums;}
.prod-price .old{font-size:10px;color:rgba(255,255,255,.65);text-decoration:line-through;margin-left:4px;display:inline;}
.add-fab{width:34px;height:34px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 16px rgba(255,196,43,.42);transition:transform .12s;}
.add-fab:active{transform:scale(.85);}
.add-fab svg{width:15px;height:15px;stroke:var(--navy);stroke-width:3;}

/* ---- toast ---- */
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;font-size:12.5px;font-weight:700;padding:11px 18px;border-radius:30px;box-shadow:0 10px 24px rgba(0,0,0,.25);z-index:200;opacity:0;transition:all .28s ease;display:flex;align-items:center;gap:8px;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast svg{width:14px;height:14px;stroke:var(--gold);}

/* ---- bottom nav ---- */
.bottom-nav{flex:0 0 auto;display:flex;justify-content:space-around;align-items:center;background:var(--white);padding:10px 6px 14px;box-shadow:0 -8px 24px rgba(36,30,22,.06);position:relative;z-index:40;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;font-weight:700;color:var(--ink-soft);position:relative;padding:4px 8px;}
.nav-item svg{width:20px;height:20px;stroke:var(--ink-soft);stroke-width:2;fill:none;}
.nav-item .pill{background:var(--navy);border-radius:14px;padding:6px 12px;margin-bottom:1px;}
.nav-item.active{color:var(--navy);}
.nav-item.active svg{stroke:var(--gold);}
.nav-item .navbadge{position:absolute;top:-2px;right:-2px;background:var(--rose);color:#fff;font-size:8px;font-weight:800;min-width:14px;height:14px;border-radius:7px;display:flex;align-items:center;justify-content:center;padding:0 3px;}

/* ---- footer cta ---- */
.footer-cta{flex:0 0 auto;padding:12px 20px 18px;background:var(--white);box-shadow:0 -8px 24px rgba(36,30,22,.06);}
.btn-primary{width:100%;background:var(--gold);color:var(--navy);font-weight:800;font-size:14px;padding:15px;border-radius:16px;box-shadow:0 10px 22px rgba(255,196,43,.35);display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-primary svg,.btn-dark svg,.btn-dark-pill svg{width:18px;height:18px;flex:0 0 18px;stroke-width:2.5;}
.btn-primary:disabled{opacity:.45;box-shadow:none;}
.btn-secondary{width:100%;background:var(--white);border:1.5px solid var(--line);color:var(--ink);font-weight:800;font-size:13.5px;padding:13px;border-radius:16px;}
.btn-dark{width:100%;background:var(--navy);color:#fff;font-weight:800;font-size:14px;padding:15px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;}
.footer-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.footer-row .lbl{font-size:11px;color:var(--ink-soft);font-weight:600;}
.footer-row .val{font-family:'Fraunces';font-size:18px;font-weight:650;color:var(--navy);}

/* ---- generic screen padding ---- */
.pad{padding:0 20px;}
.section-title{font-size:15px;font-weight:700;color:var(--ink);margin:18px 20px 10px;}
.muted{color:var(--ink-soft);font-size:12.5px;line-height:1.5;}

/* ---- splash ---- */
.splash{height:100%;background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;position:relative;overflow:hidden;}
.splash-logo-img{display:block;width:210px;height:auto;object-fit:contain;animation:pop .7s ease;}
@keyframes pop{0%{transform:scale(.6);opacity:0;}100%{transform:scale(1);opacity:1;}}
.splash h1{color:var(--navy);font-size:26px;position:relative;z-index:2;}
.splash p{color:rgba(18,34,74,.7);font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;position:relative;z-index:2;}

/* ---- onboarding ---- */
.ob{height:100%;display:flex;flex-direction:column;}
.ob-img{flex:1;position:relative;}
.ob-img img{width:100%;height:100%;object-fit:cover;}
.ob-img::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,var(--cream) 0%,rgba(255,248,234,0) 40%);}
.ob-skip{position:absolute;top:20px;right:20px;background:rgba(255,255,255,.85);padding:8px 16px;border-radius:30px;font-size:11.5px;font-weight:700;color:var(--ink);z-index:5;}
.ob-body{padding:6px 26px 24px;text-align:center;}
.ob-body h2{font-size:23px;margin-bottom:8px;}
.ob-body p{color:var(--ink-soft);font-size:13px;line-height:1.5;margin-bottom:16px;}
.ob-dots{display:flex;justify-content:center;gap:6px;margin-bottom:18px;}
.ob-dots .d{width:7px;height:7px;border-radius:50%;background:var(--line);}
.ob-dots .d.active{width:22px;border-radius:5px;background:var(--gold-deep);}

/* ---- language ---- */
.lang-card{display:flex;align-items:center;justify-content:space-between;background:var(--white);border:2px solid var(--line);border-radius:18px;padding:18px 18px;margin:0 20px 12px;}
.lang-card.selected{border-color:var(--gold-deep);background:#FFF6DE;}
.lang-card b{font-family:'Fraunces';font-size:17px;}
.lang-card span{display:block;font-size:11px;color:var(--ink-soft);margin-top:2px;}
.lang-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);}
.lang-card.selected .lang-check{background:var(--gold-deep);border-color:var(--gold-deep);position:relative;}
.lang-card.selected .lang-check::after{content:'';position:absolute;left:6px;top:2px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}

/* ---- auth screens ---- */
.auth-card{background:var(--white);border-radius:26px;margin:4px 12px 16px;padding:22px 16px 20px;box-shadow:0 14px 38px -18px rgba(18,34,74,.18);}
.auth-logo{display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.auth-full-logo{display:block;width:176px;height:auto;max-height:54px;object-fit:contain;}
.auth-title{text-align:center;font-size:21px;margin-bottom:4px;}
.auth-sub{text-align:center;color:var(--ink-soft);font-size:12px;margin-bottom:20px;}
.auth-card .field{margin-left:0;margin-right:0;}
.auth-card .field-row{margin-left:0;margin-right:0;}
.field-icon{position:relative;}
.field-icon>svg:not(.pw-eye){box-sizing:border-box;position:absolute;left:10px;top:50%;transform:translateY(-50%);width:32px;height:32px;padding:7px;border-radius:10px;background:#FFF8EA;stroke:#756B5D;pointer-events:none;z-index:2;}
.field.field-icon input{padding-left:54px;}
.field-icon>.pw-eye{position:absolute;left:auto;right:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:#756B5D;pointer-events:none;z-index:2;}
.auth-field.field-icon>svg:not(.pw-eye){top:29px;transform:none;}
.auth-field.field-icon>.pw-eye{top:45px;}
.field.field-icon input[type=password]{padding-right:48px;}
.forgot-row{text-align:right;margin:-8px 0 16px;font-size:11.5px;font-weight:700;color:var(--gold-deep);}
.divider-row{display:flex;align-items:center;gap:10px;margin:18px 0 14px;color:var(--ink-soft);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.divider-row::before,.divider-row::after{content:'';flex:1;height:1px;background:var(--line);}
.social-btn{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:12.5px;margin-bottom:10px;background:var(--white);color:var(--ink);}
.social-btn svg{width:16px;height:16px;}
.auth-foot{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:8px;}

/* ---- product detail ---- */
.pd-hero{height:320px;position:relative;background:var(--white);}
.pd-hero img{width:100%;height:100%;object-fit:cover;}
.pd-topbtns{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;}
.pd-topbtns .icon-btn{background:rgba(255,255,255,.92);}
.pd-body{padding:20px 20px 10px;}
.pd-cat{font-size:10.5px;font-weight:800;color:var(--gold-deep);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;}
.pd-body h1{font-size:22px;margin-bottom:8px;}
.pd-price-row{display:flex;align-items:baseline;gap:8px;margin-bottom:14px;}
.pd-price-row .now{font-family:'Fraunces';font-size:22px;font-weight:650;color:var(--navy);}
.pd-price-row .old{font-size:13px;color:var(--ink-soft);text-decoration:line-through;}
.qty-row{display:flex;align-items:center;gap:14px;margin:14px 0 18px;}
.qty-ctrl{display:flex;align-items:center;gap:14px;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:7px 14px;}
.qty-ctrl button{width:24px;height:24px;border-radius:8px;background:var(--cream);font-weight:800;font-size:15px;color:var(--navy);}
.qty-ctrl span{min-width:16px;text-align:center;font-weight:700;}

/* ---- cart ---- */
.cart-item{display:flex;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);align-items:center;}
.cart-item img{width:70px;height:70px;border-radius:14px;object-fit:cover;}
.cart-item .ci-info{flex:1;}
.cart-item .ci-name{font-weight:700;font-size:13px;margin-bottom:3px;}
.cart-item .ci-price{font-family:'Fraunces';color:var(--navy);font-weight:650;font-size:13.5px;}
.cart-item .ci-remove{font-size:10.5px;color:var(--danger);font-weight:700;margin-top:6px;}
.summary-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;color:var(--ink-soft);}
.summary-row.total{font-weight:800;color:var(--ink);font-size:15px;border-top:1px solid var(--line);padding-top:12px;margin-top:6px;}
.coupon-row{display:flex;gap:8px;margin:12px 20px 4px;}
.coupon-row input{flex:1;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:12.5px;outline:none;}
.coupon-row button{background:var(--navy);color:#fff;font-weight:700;font-size:12px;border-radius:14px;padding:0 18px;}

/* ---- empty state ---- */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 40px;gap:12px;}
.empty .ic{width:74px;height:74px;border-radius:50%;background:var(--white);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(36,30,22,.06);}
.empty .ic svg{width:32px;height:32px;stroke:var(--gold-deep);stroke-width:1.6;}
.empty h3{font-size:16px;}
.empty p{color:var(--ink-soft);font-size:12.5px;max-width:220px;}

/* ---- forms ---- */
.field{margin:0 20px 14px;}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:13px;outline:none;font-family:'Manrope';color:var(--ink);box-shadow:0 5px 16px rgba(18,34,74,.045);transition:border-color .2s ease,box-shadow .2s ease;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold-deep);box-shadow:0 0 0 4px rgba(227,154,0,.09),0 8px 18px rgba(18,34,74,.06);}
.field textarea{resize:none;min-height:80px;}
.char-count{text-align:right;font-size:10.5px;color:var(--ink-soft);margin-top:-10px;margin-bottom:14px;padding-right:2px;}
.field-row{display:flex;gap:10px;margin:0 20px 14px;}
.field-row .field{margin:0;flex:1;}
.checkrow{display:flex;align-items:center;gap:8px;margin:0 20px 16px;font-size:12px;color:var(--ink-soft);font-weight:600;}
.linklike{color:var(--gold-deep);font-weight:800;}
.phone-field{display:flex;gap:0;background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 5px 16px rgba(18,34,74,.045);transition:border-color .2s ease,box-shadow .2s ease;}
.phone-field:focus-within{border-color:var(--gold-deep);box-shadow:0 0 0 4px rgba(227,154,0,.09),0 8px 18px rgba(18,34,74,.06);}
.phone-field .flag{display:flex;align-items:center;gap:4px;padding:0 12px;background:var(--cream);font-size:12.5px;font-weight:700;border-right:1px solid var(--line);}
.phone-field input{border:none;flex:1;padding:13px 14px;outline:none;font-size:13px;}

/* ---- card message preview ---- */
.msg-preview{margin:0 20px 18px;background:linear-gradient(160deg,#FFF3D8,#F7E4BC);border-radius:18px;padding:22px 18px;text-align:center;position:relative;box-shadow:inset 0 0 0 1px rgba(227,154,0,.24),0 12px 26px -16px rgba(139,94,52,.34);}
.msg-preview .qtext{font-family:'Fraunces';font-style:italic;color:var(--navy);font-size:13.5px;line-height:1.5;min-height:40px;}
.msg-preview .qfrom{color:var(--rose);font-weight:800;font-size:12px;margin-top:10px;}
.msg-preview .wm{margin-top:14px;font-size:9px;letter-spacing:.14em;font-weight:800;color:rgba(18,34,74,.35);text-transform:uppercase;}

/* ---- step indicator v2 (checkout) ---- */
.steps2{display:flex;align-items:flex-start;padding:18px 26px 8px;}
.step2{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;}
.step2-circle{width:46px;height:46px;border-radius:50%;background:var(--white);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;z-index:2;}
.step2-circle svg{width:19px;height:19px;stroke:var(--ink-soft);}
.step2.active .step2-circle{background:var(--gold);border-color:var(--gold);box-shadow:0 8px 18px rgba(255,196,43,.4);}
.step2.active .step2-circle svg{stroke:var(--navy);}
.step2.done .step2-circle{background:var(--ok);border-color:var(--ok);}
.step2.done .step2-circle svg{stroke:#fff;}
.step2-badge{position:absolute;top:-4px;right:-2px;width:18px;height:18px;border-radius:50%;background:var(--navy);color:var(--gold);font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--cream);z-index:3;}
.step2-label{font-size:10px;font-weight:700;color:var(--ink-soft);}
.step2.active .step2-label{color:var(--ink);}
.step2-line{position:absolute;top:23px;right:50%;width:100%;height:2px;background:var(--line);z-index:1;}
.step2-line.filled{background:var(--ok);}

/* ---- old checkout1 step (kept for compat) ---- */
.steps{display:flex;align-items:center;padding:14px 24px 6px;}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;position:relative;}
.step .num{width:28px;height:28px;border-radius:50%;background:var(--white);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--ink-soft);}
.step.done .num{background:var(--ok);border-color:var(--ok);color:#fff;}
.step.active .num{background:var(--navy);border-color:var(--navy);color:var(--gold);}
.step span{font-size:9.5px;font-weight:700;color:var(--ink-soft);text-align:center;}
.step.active span{color:var(--ink);}

/* ---- address/delivery (checkout step 2) ---- */
.no-addr{text-align:center;padding:26px 24px 18px;}
.no-addr b{display:block;font-size:14px;margin-bottom:6px;}
.no-addr p{font-size:11.5px;color:var(--ink-soft);margin-bottom:18px;}
.btn-dark-pill{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;font-weight:800;font-size:12.5px;padding:13px 22px;border-radius:30px;}
.dashed-note{margin:0 20px 18px;border:1.5px dashed var(--line);border-radius:16px;padding:14px 16px;}
.dashed-note b{font-size:12px;display:block;margin-bottom:3px;}
.dashed-note span{font-size:11px;color:var(--ink-soft);}
.addr-set{margin:0 20px 18px;background:var(--white);border-radius:18px;padding:14px 16px;box-shadow:0 6px 16px rgba(36,30,22,.05);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.addr-set b{font-size:13px;}
.addr-set p{font-size:11.5px;color:var(--ink-soft);margin-top:4px;line-height:1.5;}
.addr-set .chg{font-size:11px;font-weight:800;color:var(--gold-deep);white-space:nowrap;}
.delivery-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:4px 20px 6px;}
.dopt{background:var(--white);border:1.5px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;}
.dopt.active{border-color:var(--navy);box-shadow:0 6px 16px rgba(18,34,74,.14);background:#F4F6FC;}
.dopt .dic{width:30px;height:30px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;}
.dopt.active .dic{background:var(--navy);}
.dopt .dic svg{width:14px;height:14px;stroke:var(--ink-soft);}
.dopt.active .dic svg{stroke:var(--gold);}
.dopt b{font-size:10.5px;display:block;margin-bottom:3px;}
.dopt span{font-size:9.5px;color:var(--ink-soft);display:block;}
.dopt .fee{font-size:9.5px;font-weight:800;color:var(--navy);margin-top:4px;display:block;}
.selected-bar{margin:10px 20px 6px;background:#EEF1FB;border-radius:14px;padding:12px 14px;font-size:11.5px;color:var(--navy);font-weight:700;}
.slot-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 20px 10px;}
.slot{background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;font-size:11.5px;font-weight:700;color:var(--ink-soft);}
.slot.active{background:var(--navy);border-color:var(--navy);color:var(--gold);}

/* ---- payment method (checkout step 3) ---- */
.pay-summary{margin:0 20px 6px;background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:20px;padding:18px;color:#fff;box-shadow:0 14px 28px -8px rgba(18,34,74,.35);}
.pay-summary .row{display:flex;justify-content:space-between;padding:5px 0;font-size:12px;color:rgba(255,255,255,.75);}
.pay-summary .row.total{border-top:1px solid rgba(255,255,255,.2);margin-top:6px;padding-top:10px;font-size:15px;font-weight:800;color:#fff;}
.pay-method{display:flex;align-items:center;gap:12px;background:var(--white);border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;margin:0 20px 10px;}
.pay-method.active{border-color:var(--gold-deep);background:#FFF8E8;}
.pay-method .pmic{width:38px;height:38px;border-radius:12px;background:var(--cream);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.pay-method .pmic svg{width:17px;height:17px;stroke:var(--navy);}
.pay-method .pmtext{flex:1;}
.pay-method b{font-size:12.5px;display:block;}
.pay-method span{font-size:10.5px;color:var(--ink-soft);}
.pay-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;position:relative;}
.pay-method.active .pay-radio{border-color:var(--gold-deep);}
.pay-method.active .pay-radio::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--gold-deep);}

/* ---- addresses / order / notif cards ---- */
.addr-card,.order-card,.notif-card{background:var(--white);border-radius:18px;padding:14px 16px;margin:0 20px 12px;border:1px solid rgba(240,230,210,.72);box-shadow:0 12px 28px -16px rgba(18,34,74,.24);}
.addr-card{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.addr-card.selected{border:1.5px solid var(--gold-deep);}
.addr-card b{font-size:13.5px;}
.addr-card p{font-size:11.5px;color:var(--ink-soft);margin-top:4px;line-height:1.5;}
.def-badge{display:inline-block;background:#FFF6DE;color:var(--gold-deep);font-size:9px;font-weight:800;padding:3px 8px;border-radius:8px;margin-top:6px;}

.order-card .oc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.order-card .oc-num{font-weight:800;font-size:13px;}
.order-card .oc-date{font-size:10.5px;color:var(--ink-soft);}
.status-pill{font-size:9.5px;font-weight:800;padding:4px 10px;border-radius:10px;}
.status-pill.delivered{background:#E7F3E9;color:var(--ok);}
.status-pill.transit{background:#FFF1E1;color:#C97A1A;}
.status-pill.placed{background:#E9EEFB;color:var(--navy);}
.order-card .oc-imgs{display:flex;gap:6px;margin:8px 0;}
.order-card .oc-imgs img{width:40px;height:40px;border-radius:10px;object-fit:cover;}
.order-card .oc-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.order-card .oc-amt{font-family:'Fraunces';font-weight:650;color:var(--navy);}
.oc-btn{font-size:11px;font-weight:800;color:var(--gold-deep);}

.notif-card{display:flex;gap:12px;align-items:flex-start;}
.notif-card.unread{background:#FFFBF0;border:1px solid #FFE9B0;}
.notif-card .ic{width:36px;height:36px;border-radius:12px;background:var(--cream);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.notif-card .ic svg{width:17px;height:17px;stroke:var(--gold-deep);}
.notif-card b{font-size:12.5px;}
.notif-card p{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.notif-card .t{font-size:10px;color:var(--ink-soft);margin-top:5px;}

/* ---- tracking (redesign) ---- */
.track-hero{margin:6px 20px 4px;background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:24px;padding:20px;color:#fff;box-shadow:0 16px 34px -10px rgba(18,34,74,.4);position:relative;overflow:hidden;}
.track-hero::before{content:'';position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,196,43,.14);top:-70px;right:-60px;}
.track-hero .th-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2;}
.track-hero .th-num{font-size:11px;color:rgba(255,255,255,.65);font-weight:700;}
.track-hero .th-status{font-family:'Fraunces';font-size:19px;margin-top:4px;color:#fff;}
.track-hero .th-icon{width:44px;height:44px;border-radius:14px;background:var(--gold);display:flex;align-items:center;justify-content:center;}
.track-hero .th-icon svg{width:20px;height:20px;stroke:var(--navy);}
.track-hero .th-eta{font-size:11.5px;color:rgba(255,255,255,.75);margin-top:10px;position:relative;z-index:2;}
.track-progress{height:6px;background:rgba(255,255,255,.18);border-radius:6px;margin-top:14px;overflow:hidden;position:relative;z-index:2;}
.track-progress .fill{height:100%;background:var(--gold);border-radius:6px;transition:width .4s ease;}
.timeline{padding:18px 24px 20px;}
.tl-item{display:flex;gap:14px;position:relative;padding-bottom:26px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{width:32px;height:32px;border-radius:50%;background:var(--white);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 auto;z-index:2;box-shadow:0 4px 10px rgba(36,30,22,.06);}
.tl-dot svg{width:14px;height:14px;stroke:var(--ink-soft);}
.tl-item.done .tl-dot{background:var(--ok);border-color:var(--ok);}
.tl-item.active .tl-dot{background:var(--navy);border-color:var(--navy);box-shadow:0 0 0 6px rgba(18,34,74,.12);}
.tl-item.done .tl-dot svg,.tl-item.active .tl-dot svg{stroke:#fff;}
.tl-line{position:absolute;left:15px;top:32px;bottom:-26px;width:2px;background:var(--line);}
.tl-item.done .tl-line{background:var(--ok);}
.tl-item:last-child .tl-line{display:none;}
.tl-body{padding-top:4px;}
.tl-body b{font-size:13px;display:block;}
.tl-item.active .tl-body b{color:var(--navy);}
.tl-body span{font-size:10.5px;color:var(--ink-soft);}
.info-card{margin:4px 20px 14px;background:var(--white);border-radius:18px;padding:16px;box-shadow:0 6px 16px rgba(36,30,22,.05);}
.info-card .irow{display:flex;justify-content:space-between;padding:7px 0;font-size:12px;border-bottom:1px solid var(--line);}
.info-card .irow:last-child{border-bottom:none;}
.info-card .irow span:first-child{color:var(--ink-soft);}
.info-card .irow span:last-child{font-weight:700;text-align:right;max-width:180px;}

/* ---- account (redesign) ---- */
.acc-hero{background:linear-gradient(135deg,var(--navy),var(--navy2));margin:6px 20px 16px;border-radius:24px;padding:20px;display:flex;align-items:center;gap:14px;color:#fff;box-shadow:0 16px 32px -10px rgba(18,34,74,.4);position:relative;overflow:hidden;}
.acc-hero::before{content:'';position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,196,43,.14);top:-60px;right:-50px;}
.acc-hero .ava{width:56px;height:56px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;color:var(--navy);font-family:'Fraunces';font-weight:700;font-size:21px;flex:0 0 auto;position:relative;z-index:2;}
.acc-hero .info{position:relative;z-index:2;flex:1;}
.acc-hero b{font-size:16px;display:block;}
.acc-hero .em{font-size:11.5px;color:rgba(255,255,255,.7);}
.acc-stats{display:flex;gap:8px;margin-top:10px;}
.acc-stats span{background:rgba(255,255,255,.14);border-radius:10px;padding:4px 10px;font-size:10px;font-weight:700;}
.menu-group-title{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:18px 20px 8px;}
.menu-group{margin:0 20px 4px;background:var(--white);border:1px solid rgba(240,230,210,.7);border-radius:18px;box-shadow:0 12px 28px -17px rgba(18,34,74,.22);overflow:hidden;}
.menu-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);}
.menu-row:last-child{border-bottom:none;}
.menu-row .mi{width:36px;height:36px;border-radius:12px;background:var(--cream);display:flex;align-items:center;justify-content:center;}
.menu-row .mi svg{width:17px;height:17px;stroke:var(--navy);}
.menu-row span{flex:1;font-size:13px;font-weight:700;}
.menu-row svg.chev{width:14px;height:14px;stroke:var(--ink-soft);}
.menu-row.logout span{color:var(--danger);}
.menu-row.logout .mi{background:#FCEAEA;}
.menu-row.logout .mi svg{stroke:var(--danger);}

/* ---- success ---- */
.success-wrap{padding:40px 30px 20px;text-align:center;}
.success-check{width:84px;height:84px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 14px 30px rgba(92,148,100,.35);animation:pop .5s ease;}
.success-check svg{width:38px;height:38px;stroke:#fff;stroke-width:3;}
.success-wrap h1{font-size:22px;margin-bottom:6px;}
.success-wrap p{color:var(--ink-soft);font-size:12.5px;margin-bottom:20px;}
.success-card{background:var(--white);border-radius:18px;padding:16px;text-align:left;box-shadow:0 8px 20px rgba(36,30,22,.06);}
.success-card .row{display:flex;justify-content:space-between;padding:7px 0;font-size:12.5px;}
.success-card .row span:first-child{color:var(--ink-soft);}
.success-card .row span:last-child{font-weight:700;}

/* ---- processing ---- */
.processing{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
.spinner{width:54px;height:54px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--gold-deep);animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.processing p{font-weight:700;color:var(--ink);font-size:13.5px;}

/* ---- search results ---- */
.recent-tag{display:inline-flex;align-items:center;gap:6px;background:var(--white);border:1px solid var(--line);border-radius:20px;padding:8px 12px;font-size:11.5px;font-weight:600;margin:0 8px 8px 0;}
.tag-wrap{display:flex;flex-wrap:wrap;padding:0 20px;}
.search-shell{padding:8px 20px 14px;}
.search-title{font-size:24px;margin-bottom:5px;}
.search-lead{font-size:12px;color:var(--ink-soft);margin-bottom:16px;}
.search-input-wrap{position:relative;display:flex;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:0 14px;box-shadow:0 10px 24px rgba(18,34,74,.07);}
.search-input-wrap:focus-within{border-color:var(--gold-deep);box-shadow:0 0 0 4px rgba(227,154,0,.1);}
.search-input-wrap svg{width:19px;height:19px;color:var(--navy);flex:0 0 auto;}
.search-input-wrap input{width:100%;border:0;outline:0;background:transparent;padding:14px 10px;font:600 13px 'Manrope';color:var(--ink);}
.search-clear{font-size:11px;font-weight:800;color:var(--gold-deep);padding:6px;}
.recent-tag svg{width:13px;height:13px;color:var(--ink-soft);}
.recent-clear{font-size:10.5px;font-weight:800;color:var(--gold-deep);}
.search-suggest{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;padding:0 20px 4px;}
.search-suggest button{background:#FFF8EA;border:1px solid #F3E5CB;border-radius:14px;padding:11px 12px;text-align:left;font-size:11.5px;font-weight:700;color:var(--navy);}

/* ---- OTP verification ---- */
.otp-wrap{padding:36px 24px 24px;text-align:center;}
.otp-mark{width:64px;height:64px;border-radius:20px;background:var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 14px 28px rgba(227,154,0,.25);}
.otp-mark svg{width:28px;height:28px;stroke:var(--navy);}
.otp-wrap h1{font-size:24px;margin-bottom:7px;}
.otp-wrap .muted{max-width:280px;margin:0 auto;}
.otp-email{font-weight:800;color:var(--navy);}
.otp-inputs{display:flex;justify-content:center;gap:10px;margin:28px 0 20px;}
.otp-inputs input{width:52px;height:58px;border:1.5px solid var(--line);border-radius:16px;text-align:center;font:800 22px 'Manrope';color:var(--navy);outline:none;background:#fff;caret-color:var(--gold-deep);}
.otp-inputs input:focus{border-color:var(--gold-deep);box-shadow:0 0 0 4px rgba(227,154,0,.1);}
.otp-resend{margin-top:16px;font-size:12px;color:var(--ink-soft);}
.otp-resend button{color:var(--gold-deep);font-weight:800;}

/* ---- settings ---- */
.set-row{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line);}
.set-row span{font-size:13px;font-weight:700;}
.set-row .val{font-size:12px;color:var(--ink-soft);font-weight:600;}
.toggle{width:42px;height:24px;border-radius:14px;background:var(--line);position:relative;flex:0 0 auto;}
.toggle.on{background:var(--gold-deep);}
.toggle .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;}

/* ============ HELPERS ============ */
function money(n){ return 'BD ' + Number(n).toFixed(3); }
function findProduct(id){ return PRODUCTS.find(p=>p.id==id); }
function cartCount(){ return cart.reduce((s,c)=>s+c.qty,0); }
function cartTotal(){ return cart.reduce((s,c)=>s+findProduct(c.id).price*c.qty,0); }
function unreadCount(){ return notifs.filter(n=>n.unread).length; }

function go(screen, params={}){
  history_.push(current);
  current = {screen, params};
  render();
}
function replaceScreen(screen, params={}){
  current = {screen, params};
  render();
}
function goBack(){
  if(history_.length){ current = history_.pop(); render(); } else { render(); }
}
function goHome(){
  history_ = [];
  current = {screen:'home', params:{}};
  render();
}

function toast(msg){
  const root = document.getElementById('screenRoot');
  let t = root.querySelector('.toast');
  if(!t){
    t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg><span></span>';
    root.appendChild(t);
  }
  t.querySelector('span').textContent = msg;
  requestAnimationFrame(()=>t.classList.add('show'));
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 1800);
}

function addToCart(id, qty=1){
  const existing = cart.find(c=>c.id==id);
  if(existing) existing.qty += qty; else cart.push({id, qty});
  toast('Added to cart');
  refreshBadges();
}
function removeFromCart(id){
  cart = cart.filter(c=>c.id!=id);
  render();
}
function changeQty(id, delta){
  const item = cart.find(c=>c.id==id);
  if(!item) return;
  item.qty += delta;
  if(item.qty<=0) cart = cart.filter(c=>c.id!=id);
  render();
}
function toggleWishlist(id){
  if(wishlist.includes(id)) wishlist = wishlist.filter(w=>w!=id);
  else { wishlist.push(id); toast('Added to wishlist'); }
  refreshBadges();
  render();
}
function refreshBadges(){
  document.querySelectorAll('[data-cartbadge]').forEach(el=>{
    const n = cartCount();
    el.style.display = n>0 ? 'flex':'none';
    el.textContent = n;
  });
  document.querySelectorAll('[data-wishbadge]').forEach(el=>{
    const n = wishlist.length;
    el.style.display = n>0 ? 'flex':'none';
    el.textContent = n;
  });
}

/* ============ SCREEN CHROME ============ */
function statusBar(){
  return '<div class="status"><span>9:41</span><div class="icons"><span>●●●●</span><span>Wi-Fi</span><span>100%</span></div></div>';
}
function topbar(title, opts={}){
  let right = opts.right || '';
  return '<div class="topbar"><button class="backbtn" onclick="goBack()">'+icon('back')+'</button><h2>'+title+'</h2>'+right+'</div>';
}
function bottomNav(active){
  const items = [
    {k:'home', label:'Home', ic:'home'},
    {k:'categories', label:'Categories', ic:'grid'},
    {k:'search', label:'Search', ic:'search'},
    {k:'cart', label:'Cart', ic:'cart'},
    {k:'account', label:'Profile', ic:'user'}
  ];
  return '<div class="bottom-nav">' + items.map(it=>{
    const isActive = active===it.k;
    let badge = '';
    if(it.k==='cart') badge = '<span class="navbadge" data-cartbadge style="display:'+(cartCount()>0?'flex':'none')+'">'+cartCount()+'</span>';
    if(it.k==='wishlist') badge = '<span class="navbadge" data-wishbadge style="display:'+(wishlist.length>0?'flex':'none')+'">'+wishlist.length+'</span>';
    return '<button class="nav-item '+(isActive?'active':'')+'" onclick="goHome_tab(\''+it.k+'\')">'+
      (isActive?'<div class="pill">'+icon(it.ic)+'</div>':icon(it.ic))+
      '<span>'+it.label+'</span>'+badge+'</button>';
  }).join('') + '</div>';
}
function goHome_tab(k){
  history_ = [];
  current = {screen:k, params:{}};
  render();
}

function productCardHtml(p){
  const disc = p.old ? Math.round(100-(p.price/p.old*100)) : null;
  return '<div class="prod-card" onclick="go(\'product\',{id:'+p.id+'})">'+
    '<div class="prod-media"><img src="'+p.img+'" alt="'+p.name+'" loading="lazy">'+
    (disc?'<div class="disc-badge">-'+disc+'%</div>':'')+'</div>'+
    '<div class="prod-info"><div class="pname">'+p.name+'</div><div class="prod-row">'+
    '<div class="prod-price"><span class="now">'+money(p.price)+'</span>'+(p.old?'<span class="old">'+money(p.old)+'</span>':'')+'</div>'+icon('chevright')+
    '</div></div></div>';
}

/* ============ RENDER ROUTER ============ */
function render(){
  const root = document.getElementById('screenRoot');
  let html = '';
  switch(current.screen){
    case 'splash': html = renderSplash(); break;
    case 'onboarding': html = renderOnboarding(); break;
    case 'language': html = renderLanguage(); break;
    case 'home': html = renderHome(); break;
    case 'categories': html = renderCategories(); break;
    case 'productlist': html = renderProductList(current.params); break;
    case 'product': html = renderProduct(current.params); break;
    case 'search': html = renderSearch(); break;
    case 'wishlist': html = renderWishlist(); break;
    case 'cart': html = renderCart(); break;
    case 'login': html = renderLogin(); break;
    case 'register': html = renderRegister(); break;
    case 'otp': html = renderOtp(); break;
    case 'checkout1': html = renderCheckout1(); break;
    case 'checkout2': html = renderCheckout2(); break;
    case 'checkout3': html = renderCheckout3(); break;
    case 'processing': html = renderProcessing(); break;
    case 'success': html = renderSuccess(); break;
    case 'tracking': html = renderTracking(current.params); break;
    case 'myorders': html = renderMyOrders(); break;
    case 'orderdetail': html = renderOrderDetail(current.params); break;
    case 'account': html = renderAccount(); break;
    case 'notifications': html = renderNotifications(); break;
    case 'settings': html = renderSettings(); break;
    case 'addresses': html = renderAddresses(); break;
    default: html = renderHome();
  }
  root.innerHTML = html;
  refreshBadges();
}

/* ============ PRODUCT DETAIL ============ */
let pdQty = 1;
function renderProduct(params){
  const p = findProduct(params.id);
  pdQty = 1;
  const related = PRODUCTS.filter(x=>x.category===p.category && x.id!==p.id).slice(0,4);
  return '<div class="appwrap">'+
    '<div class="content" style="padding-bottom:0;">'+
    '<div class="pd-hero"><img src="'+p.img+'">'+
    '<div class="pd-topbtns"><button class="icon-btn" onclick="goBack()">'+icon('back')+'</button>'+
    '<button class="icon-btn '+(wishlist.includes(p.id)?'on':'')+'" onclick="toggleWishlist('+p.id+')">'+icon('heart')+'</button></div>'+
    '</div>'+
    '<div class="pd-body">'+
    '<h1>'+p.name+'</h1>'+
    '<div class="pd-price-row"><span class="now">'+money(p.price)+'</span>'+(p.old?'<span class="old">'+money(p.old)+'</span>':'')+'</div>'+
    '<p class="muted">'+p.desc+'</p>'+
    '<div class="qty-row"><span style="font-size:12px;font-weight:700;">Quantity</span>'+
    '<div class="qty-ctrl"><button onclick="pdQtyChange(-1)">-</button><span id="pdqty">1</span><button onclick="pdQtyChange(1)">+</button></div></div>'+
    '<div class="section-title" style="margin:8px 0 8px;padding:0;">Product Care</div>'+
    '<p class="muted">Trim stems at an angle, change water every 2 days, and keep away from direct sunlight for lasting freshness.</p>'+
    '</div>'+
    (related.length?'<div class="section-title">Related Products</div><div class="prod-scroll">'+related.map(r=>productCardHtml(r)).join('')+'</div>':'')+
    '<div style="height:12px;"></div>'+
    '</div>'+
    '<div class="footer-cta" style="display:flex;gap:10px;">'+
    '<button class="btn-secondary" style="flex:1" onclick="addToCart('+p.id+', pdQty)">Add to Cart</button>'+
    '<button class="btn-primary" style="flex:1" onclick="addToCart('+p.id+', pdQty);go(\'cart\')">Buy Now</button>'+
    '</div></div>';
}
function pdQtyChange(d){
  pdQty = Math.max(1, pdQty+d);

/* ============ SEARCH ============ */
let recentSearches = (()=>{
  try { return JSON.parse(localStorage.getItem('flowerlinkRecentSearches')) || ['Rose','Birthday cake','Balloons']; }
  catch(e){ return ['Rose','Birthday cake','Balloons']; }
})();
function saveRecentSearch(q){
  q = q.trim();
  if(!q) return;
  recentSearches = [q].concat(recentSearches.filter(x=>x.toLowerCase()!==q.toLowerCase())).slice(0,6);
  try { localStorage.setItem('flowerlinkRecentSearches',JSON.stringify(recentSearches)); } catch(e){}
}
function renderSearch(){
  const q = searchQuery.trim().toLowerCase();
  const results = q ? PRODUCTS.filter(p=>(p.name+' '+p.category+' '+p.occasion).toLowerCase().includes(q)) : [];
  return '<div class="appwrap">'+statusBar()+
    '<div class="topbar"><button class="backbtn" onclick="goHome()">'+icon('back')+'</button><h2>Search</h2></div>'+
    '<div class="content">'+

    '<div class="search-input-wrap">'+icon('search')+'<input id="searchInput" placeholder="Try “roses” or “birthday”" value="'+searchQuery+'" oninput="onSearchInput(this.value)" onkeydown="searchKeydown(event)" autofocus>'+
    (searchQuery?'<button class="search-clear" onclick="clearSearch()">Clear</button>':'')+'</div></div>'+
    (!searchQuery ? (
      '<div class="sec-head"><div><span class="eyebrow">Your history</span><h3>Recent searches</h3></div>'+(recentSearches.length?'<button class="recent-clear" onclick="clearRecentSearches()">Clear all</button>':'')+'</div>'+

      '<div class="section-title">Popular</div><div class="prodgrid">'+PRODUCTS.slice(0,4).map(p=>productCardHtml(p)).join('')+'</div>'
    ) : (results.length ?
      '<div class="pad" style="padding:12px 20px 0;"><p class="muted">'+results.length+' results for "'+searchQuery+'"</p></div><div class="prodgrid">'+results.map(p=>productCardHtml(p)).join('')+'</div>'

function beginRegistration(){

    '<div class="otp-inputs">'+[0,1,2,3].map(i=>'<input id="otp'+i+'" inputmode="numeric" maxlength="1" aria-label="OTP digit '+(i+1)+'" oninput="otpInput(this,'+i+')" onkeydown="otpBack(event,'+i+')">').join('')+'</div>'+
    '<button class="btn-primary" onclick="verifyOtp()">Verify &amp; continue '+icon('chevright')+'</button>'+
    '<div class="otp-resend">Didn\'t receive it? <button onclick="toast(\'A new code has been sent\')">Resend code</button></div></div></div></div>';

function otpInput(el,i){ el.value=el.value.replace(/\D/g,'').slice(0,1); if(el.value && i<3) document.getElementById('otp'+(i+1)).focus(); }
function otpBack(e,i){ if(e.key==='Backspace' && !e.target.value && i>0) document.getElementById('otp'+(i-1)).focus(); }
function verifyOtp(){
  const code=[0,1,2,3].map(i=>document.getElementById('otp'+i).value).join('');
  if(code.length!==4){ toast('Enter the complete 4-digit code'); return; }
  user={name:registrationDraft.name,email:registrationDraft.email};
  toast('Email verified');
  history_=history_.filter(h=>!['login','register','otp'].includes(h.screen));
  setTimeout(()=>replaceScreen('checkout1'),350);
}

/* ============ STEP INDICATOR V2 ============ */
function stepIndicator(active){
  const steps = [{ic:'msg',label:'Message'},{ic:'map',label:'Address'},{ic:'card',label:'Payment'}];
  return '<div class="steps2">'+steps.map((s,i)=>{
    const idx = i+1;
    const state = idx<active?'done':(idx===active?'active':'');
    return '<div class="step2 '+state+'">'+(i>0?'<div class="step2-line '+(idx<=active?'filled':'')+'"></div>':'')+
      '<div class="step2-circle">'+icon(s.ic)+'<span class="step2-badge">'+(idx<active?'✓':idx)+'</span></div>'+
      '<span class="step2-label">'+s.label+'</span></div>';
  }).join('')+'</div>';
}

/* ============ ORDER TRACKING (redesign) ============ */
function renderTracking(params){
  const order = orders.find(o=>o.id===params.orderId) || orders[0];
  const stages = [
    {k:'placed', label:'Order Placed', sub:order.date, ic:'box'},
    {k:'confirmed', label:'Payment Confirmed', sub:'Payment received', ic:'card'},
    {k:'preparing', label:'Preparing Your Order', sub:'Our florists are at work', ic:'gift'},
    {k:'transit', label:'Out for Delivery', sub:order.slot||'', ic:'truck'},
    {k:'delivered', label:'Delivered', sub:'Enjoy your gift!', ic:'check'}
  ];
  const curIdx = order.status==='delivered' ? 4 : (order.status==='transit'?3: (order.status==='placed'?1:0));
  const statusLabels = ['Order Placed','Payment Confirmed','Preparing','Out for Delivery','Delivered'];
  return '<div class="appwrap">'+statusBar()+
    topbar('Track Order')+
    '<div class="content">'+
    '<div class="track-hero"><div class="th-top"><div><div class="th-num">Order #'+order.id+'</div><div class="th-status">'+statusLabels[curIdx]+'</div></div><div class="th-icon">'+icon('package')+'</div></div>'+
    '<div class="th-eta">Estimated delivery: '+(order.date_delivery||order.date)+(order.slot?' · '+order.slot:'')+'</div>'+
    '<div class="track-progress"><div class="fill" style="width:'+((curIdx+1)/5*100)+'%;"></div></div>'+
    '</div>'+
    '<div class="timeline">'+stages.map((s,i)=>{
      const cls = i<curIdx?'done':(i===curIdx?'active':'');
      return '<div class="tl-item '+cls+'"><div class="tl-line"></div><div class="tl-dot">'+icon(s.ic)+'</div><div class="tl-body"><b>'+s.label+'</b><span>'+s.sub+'</span></div></div>';
    }).join('')+'</div>'+
    '<div class="info-card">'+
    '<div class="irow"><span>Delivery Date</span><span>'+(order.date_delivery||order.date)+'</span></div>'+
    '<div class="irow"><span>Delivery Option</span><span>'+(order.deliveryLabel||'—')+'</span></div>'+
    '<div class="irow"><span>Recipient</span><span>'+order.recipient+'</span></div>'+
    '<div class="irow"><span>Delivery Address</span><span>'+(order.addressText||'—')+'</span></div>'+
    '</div>'+
    '</div>'+
    '<div class="footer-cta"><button class="btn-secondary" onclick="go(\'orderdetail\',{orderId:\''+order.id+'\'})">Order Details</button></div>'+
    '</div>';
}

/* ============ MY ORDERS ============ */
function renderMyOrders(){
  return '<div class="appwrap">'+statusBar()+
    topbar('My Orders')+
    '<div class="content">'+
    (orders.length===0 ? emptyState('box','No orders yet','Your placed orders will show up here.') :
    orders.map(o=>{
      const pillCls = o.status==='delivered'?'delivered':(o.status==='transit'?'transit':'placed');
      const pillLabel = o.status==='delivered'?'Delivered':(o.status==='transit'?'Out for Delivery':'Order Placed');
      return '<div class="order-card"><div class="oc-top"><span class="oc-num">#'+o.id+'</span><span class="status-pill '+pillCls+'">'+pillLabel+'</span></div>'+
      '<div class="oc-date">'+o.date+'</div>'+
      '<div class="oc-imgs">'+o.items.slice(0,4).map(p=>'<img src="'+p.img+'">').join('')+'</div>'+
      '<div class="oc-bottom"><span class="oc-amt">'+money(o.total)+'</span><div style="display:flex;gap:14px;"><span class="oc-btn" onclick="go(\'tracking\',{orderId:\''+o.id+'\'})">Track</span><span class="oc-btn" onclick="go(\'orderdetail\',{orderId:\''+o.id+'\'})">Details</span></div></div>'+
      '</div>';
    }).join(''))+
    '</div></div>';
}

/* ============ ORDER DETAILS (redesign) ============ */
function renderOrderDetail(params){
  const order = orders.find(o=>o.id===params.orderId) || orders[0];
  return '<div class="appwrap">'+statusBar()+
    topbar('Order Details')+
    '<div class="content">'+
    '<div class="track-hero" style="padding:16px 18px;"><div class="th-top"><div><div class="th-num">Order #'+order.id+'</div><div class="th-status" style="font-size:16px;">'+money(order.total)+'</div></div><div class="th-icon">'+icon('doc')+'</div></div>'+
    '<div class="th-eta">Placed on '+order.date+'</div></div>'+
    '<div class="section-title">Products</div>'+
    order.items.map(p=>'<div class="cart-item"><img src="'+p.img+'"><div class="ci-info"><div class="ci-name">'+p.name+'</div><div class="ci-price">'+money(p.price)+'</div></div></div>').join('')+
    '<div class="section-title">Recipient &amp; Delivery</div>'+
    '<div class="info-card">'+
    '<div class="irow"><span>Recipient</span><span>'+order.recipient+'</span></div>'+
    '<div class="irow"><span>Address</span><span>'+(order.addressText||'—')+'</span></div>'+
    '<div class="irow"><span>Delivery Date</span><span>'+(order.date_delivery||order.date)+'</span></div>'+
    '<div class="irow"><span>Delivery Slot</span><span>'+(order.slot||'—')+'</span></div>'+
    '</div>'+
    '<div class="section-title">Payment</div>'+
    '<div class="info-card">'+
    '<div class="irow"><span>Method</span><span>'+(order.paymentMethod||'Credit / Debit Card')+'</span></div>'+
    '<div class="irow"><span>Status</span><span style="color:var(--ok);">Paid</span></div>'+
    '<div class="irow"><span>Total</span><span>'+money(order.total)+'</span></div>'+
    '</div>'+
    '</div>'+
    '<div class="footer-cta"><button class="btn-primary" onclick="go(\'tracking\',{orderId:\''+order.id+'\'})">Track Order</button></div>'+
    '</div>';
}

/* ============ ACCOUNT (redesign) ============ */
function renderAccount(){
  const u = user || {name:'Guest User', email:'Not logged in'};
  const initial = u.name.charAt(0);
  const shopping = [
    {ic:'box', label:'My Orders', go:()=>go('myorders')},
    {ic:'heart', label:'Wishlist', go:()=>go('wishlist')},
    {ic:'map', label:'Addresses', go:()=>go('addresses')}
  ];
  const support = [
    {ic:'doc', label:'Invoices', go:()=>toast('Invoices (mock)')},
    {ic:'wallet', label:'Wallet & Rewards', go:()=>toast('Wallet & Rewards (mock)')},
    {ic:'gift', label:'My Occasions', go:()=>toast('My Occasions (mock)')},
    {ic:'phone2', label:'Contact Us', go:()=>toast('Contact Us (mock)')}
  ];
  const appGroup = [
    {ic:'settings', label:'Settings', go:()=>go('settings')}
  ];
  window.__acctShopping = shopping;
  window.__acctSupport = support;
  window.__acctApp = appGroup;
  const menuGroup = (arr, ref) => arr.map((m,i)=>'<div class="menu-row" onclick="'+ref+'['+i+'].go()"><div class="mi">'+icon(m.ic)+'</div><span>'+m.label+'</span>'+icon('chevright','chev')+'</div>').join('');
  return '<div class="appwrap">'+statusBar()+
    '<div style="padding:14px 20px 0;"><h1 style="font-size:22px;">Account</h1></div>'+
    '<div class="content">'+
    '<div class="acc-hero"><div class="ava">'+initial+'</div><div class="info"><b>'+u.name+'</b><div class="em">'+u.email+'</div>'+
    '<div class="acc-stats"><span>'+orders.length+' Orders</span><span>'+wishlist.length+' Wishlist</span></div></div></div>'+
    '<div class="menu-group-title">Shopping</div><div class="menu-group">'+menuGroup(shopping,'__acctShopping')+'</div>'+
    '<div class="menu-group-title">Support</div><div class="menu-group">'+menuGroup(support,'__acctSupport')+'</div>'+
    '<div class="menu-group-title">Preferences</div><div class="menu-group">'+menuGroup(appGroup,'__acctApp')+
    (user ? '<div class="menu-row logout" onclick="doLogout()"><div class="mi">'+icon('logout')+'</div><span>Logout</span></div>' : '')+
    '</div>'+
    (!user ? '<div style="padding:6px 20px 20px;"><button class="btn-primary" onclick="go(\'login\')">Login / Sign Up</button></div>' : '<div style="height:14px;"></div>')+
    '</div>'+
    bottomNav('account')+
    '</div>';
}
function doLogout(){ user=null; toast('Logged out'); render(); }

/* ============ NOTIFICATIONS ============ */
function renderNotifications(){
  return '<div class="appwrap">'+statusBar()+
    topbar('Notifications')+
    '<div class="content">'+
    (notifs.length===0 ? emptyState('bell','No notifications','You are all caught up!') :
    notifs.map((n,i)=>'<div class="notif-card '+(n.unread?'unread':'')+'" onclick="markRead('+i+')"><div class="ic">'+icon(n.icon)+'</div><div><b>'+n.title+'</b><p>'+n.body+'</p><div class="t">'+n.t+'</div></div></div>').join(''))+
    '</div></div>';
}
function markRead(i){ notifs[i].unread=false; render(); }

/* ============ SETTINGS (separate, standalone) ============ */
let notifSetting = true;
function renderSettings(){
  return '<div class="appwrap">'+statusBar()+
    topbar('Settings')+
    '<div class="content">'+
    '<div class="set-row" onclick="go(\'language\')"><span>Language</span><span class="val">'+(lang==='en'?'English':'العربية')+' ›</span></div>'+
    '<div class="set-row" onclick="notifSetting=!notifSetting;render();"><span>Push Notifications</span><div class="toggle '+(notifSetting?'on':'')+'"><div class="knob"></div></div></div>'+
    '<div class="set-row" onclick="toast(\'Account settings (mock)\')"><span>Account Settings</span><span class="val">›</span></div>'+
    '<div class="set-row" onclick="toast(\'Privacy Policy (mock)\')"><span>Privacy Policy</span><span class="val">›</span></div>'+
    '<div class="set-row" onclick="toast(\'Terms & Conditions (mock)\')"><span>Terms &amp; Conditions</span><span class="val">›</span></div>'+
    '<div class="set-row" onclick="toast(\'About Flower Link (mock)\')"><span>About Flower Link</span><span class="val">›</span></div>'+
    '<div class="set-row" onclick="toast(\'Contact Us (mock)\')"><span>Contact Us</span><span class="val">›</span></div>'+
    '<div class="set-row"><span>App Version</span><span class="val">1.0.0</span></div>'+
    '</div></div>';
}

/* ============ ADDRESSES ============ */
function renderAddresses(){
  const hasAddr = !!checkoutData.addressText;
  return '<div class="appwrap">'+statusBar()+
    topbar('Saved Addresses')+
    '<div class="content">'+
    (hasAddr ?
      '<div class="addr-card"><div><b>Home</b><p>'+checkoutData.addressText+'</p><span class="def-badge">Default</span></div><div style="display:flex;flex-direction:column;gap:8px;font-size:11px;font-weight:800;color:var(--gold-deep);"><span onclick="toast(\'Edit address (mock)\')">Edit</span><span onclick="checkoutData.addressText=null;render()" style="color:var(--danger);">Delete</span></div></div>'
      : emptyState('map','No addresses saved','Add a delivery address to speed up checkout.'))+
    '</div>'+
    '<div class="footer-cta"><button class="btn-primary" onclick="addNewAddressMock()">+ Add New Address</button></div>'+
    '</div>';
}

/* ============ EMPTY STATE ============ */
function emptyState(ic, title, sub){
  return '<div class="empty"><div class="ic">'+icon(ic)+'</div><h3>'+title+'</h3><p>'+sub+'</p></div>';
}

/* ============ INIT ============ */
render();
</script>
</body>
</html>
